name: Build PS4 PKG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'native/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: stremio-ps4
          path: |
            dist/*.pkg
            dist/SHA256SUMS
            dist/build.log
            dist/compiler.log
          if-no-files-found: error
